name: Validate infrastructure

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate main stack
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Lint CloudFront function
        run: node --check infra/clean-urls.js
